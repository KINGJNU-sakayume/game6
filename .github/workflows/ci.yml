# 검사 → 브라우저 검사. 기본 브랜치에서 통과하면 pages.yml이 GitHub Pages에 배포한다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사 · 테스트 · 빌드
    # 같은 저장소 브랜치의 PR은 push 때 이미 검사했으므로, 포크에서 온 PR만 다시 검사한다
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
      - name: 긴 퍼즈 (무작위 봇 200판)
        run: npm run test:fuzz
      - name: 웹 빌드 (GitHub Pages용)
        run: npx vite build
      - name: 아티팩트용 단일 HTML
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: order-set-html
          path: |
            dist-artifact/order-set.html
            dist-artifact/preview.html
          retention-days: 14

  browser:
    name: 브라우저 검사 (클릭 연기 검사 · 스크린숏)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 웹 빌드와 미리보기 서버
        run: |
          npx vite build
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log
          exit 1
      - name: 클릭 연기 검사 (웹 빌드)
        run: npx tsx scripts/ui-smoke.ts --url http://localhost:4173/ --steps 400
      - name: 화면별 스크린숏
        run: npx tsx scripts/screenshots.ts --url http://localhost:4173/
      - name: 클릭 연기 검사 (아티팩트용 단일 HTML)
        run: |
          npm run build:artifact
          python3 -m http.server 5190 --directory dist-artifact > http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5190/preview.html > /dev/null && break; sleep 1; done
          npx tsx scripts/ui-smoke.ts --url http://localhost:5190/preview.html --steps 300 --out shots/smoke-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          retention-days: 14
